<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Data Viewer</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --line:#ddd; --card:#fff; --accent:#0b6bcb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  h2 { font-size:15px; margin:0 0 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; }
  input, select { width:100%; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.secondary { background:#fff; color:var(--fg); border-color:var(--line); }
  .status { margin-left:10px; color:var(--muted); }
  .error { color:#b00020; }
  .fields { display:flex; flex-wrap:wrap; gap:6px 16px; margin:8px 0 12px; }
  .fields label { display:flex; gap:6px; align-items:center; color:var(--fg); font-size:13px; margin:0; }
  .fields input { width:auto; }
  .table-wrap { overflow:auto; max-height:520px; border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:#f3f3f3; }
  pre { background:#f6f6f6; padding:12px; border-radius:6px; overflow:auto; max-height:400px; font-size:12px; }
  details summary { cursor:pointer; color:var(--muted); }
  .hidden { display:none; }
  .hint { font-size:13px; color:var(--muted); margin:-4px 0 12px; }
  .hint b { color:var(--fg); font-weight:600; }
  select:disabled { color:var(--muted); background:#f3f3f3; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tabs button { background:none; color:var(--muted); border:0; border-bottom:2px solid transparent; border-radius:0; margin-bottom:-1px; }
  .tabs button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  @media (max-width:640px) { .row, .row.three { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>API Data Viewer</h1>
  <p id="savedNote" class="hint hidden">This shared version shows saved data only, so the dropdowns list just what has been saved.</p>

  <!-- To add another API: add a button here and a matching <div id="tab-NAME" class="hidden"> below. -->
  <nav class="tabs" id="tabs">
    <button data-tab="macro" class="active">Macroeconomic</button>
    <button data-tab="fundamentals">Fundamentals</button>
  </nav>

  <div id="tab-fundamentals" class="hidden">
    <section>
      <h2>Analyst estimates</h2>
      <div class="row three">
        <div><label for="market">Market</label><select id="market"><option value="3">TASI</option><option value="14">NOMU</option></select></div>
        <div><label for="symbol">Stock symbol</label><input id="symbol" placeholder="e.g. 2222 for Saudi Aramco"></div>
        <div><label for="period">Period</label><select id="period"><option value="year">Annual</option><option value="quarter">Quarterly</option></select></div>
      </div>
      <div id="fHint" class="hint">The sandbox allows 5 requests a minute and 100 a day, so a company you have already fetched loads from <b>data/fundamentals/</b> until you re-fetch it.</div>
      <button id="fFetchBtn">Fetch</button>
      <button id="fRefreshBtn" class="secondary">Re-fetch from API</button>
      <span id="fStatus" class="status"></span>
    </section>
  </div>

  <div id="tab-macro">
  <section>
    <div class="row">
      <div><label for="base">API base URL</label><input id="base"></div>
      <div><label for="endpoint">Endpoint</label><select id="endpoint"></select></div>
    </div>
    <div id="pickers" class="row hidden">
      <div><label for="group">Group</label><select id="group"></select></div>
      <div id="fieldWrap"><label for="field">Field</label><select id="field" disabled></select></div>
    </div>
    <div style="margin-bottom:12px"><label for="path">Path (filled in from the pickers, or edit by hand)</label><input id="path"></div>
    <div id="hint" class="hint"></div>
    <button id="fetchBtn">Fetch</button>
    <button id="refreshBtn" class="secondary">Re-fetch from API</button>
    <span id="status" class="status"></span>
  </section>
  </div>

  <section id="results" class="hidden">
    <h2>Fields <span id="count" class="status"></span></h2>
    <button class="secondary" id="allBtn">All</button>
    <button class="secondary" id="noneBtn">None</button>
    <div id="fields" class="fields"></div>
    <div style="margin-bottom:12px">
      <button id="csvBtn">Export CSV</button>
      <button id="jsonBtn">Export JSON</button>
    </div>
    <div class="table-wrap"><table id="table"></table></div>
    <details style="margin-top:12px"><summary>Raw JSON</summary><pre id="raw"></pre></details>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let endpoints = [], rows = [], columns = [];

// Find the list of records in a response: the array itself, or the first array of objects inside it.
function findRecords(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === "object") {
    for (const v of Object.values(data)) {
      if (Array.isArray(v) && v.length && typeof v[0] === "object") return v;
    }
    for (const v of Object.values(data)) {
      const found = v && typeof v === "object" ? findRecords(v) : null;
      if (found && found.length) return found;
    }
    return [data];
  }
  return [{ value: data }];
}

// Flatten nested objects into dotted keys: {name:{en:"x"}} -> {"name.en":"x"}
function flatten(obj, prefix = "", out = {}) {
  if (obj === null || typeof obj !== "object") { out[prefix || "value"] = obj; return out; }
  for (const [k, v] of Object.entries(obj)) {
    const key = prefix ? `${prefix}.${k}` : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, key, out);
    else out[key] = Array.isArray(v) ? JSON.stringify(v) : v;
  }
  return out;
}

// Expand a nested list of objects (e.g. subGroups) into one row per item, keeping the parent's fields.
function expand(rec) {
  const key = Object.keys(rec).find(k => Array.isArray(rec[k]) && rec[k].length && typeof rec[k][0] === "object");
  if (!key) return [rec];
  const { [key]: items, ...parent } = rec;
  return items.flatMap(item => expand(item).map(child =>
    ({ ...parent, ...Object.fromEntries(Object.entries(child).map(([k, v]) => [`${key}.${k}`, v])) })));
}

const selected = () => [...document.querySelectorAll("#fields input:checked")].map(c => c.value);

function renderTable() {
  const cols = selected();
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  $("table").innerHTML =
    `<thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>`;
}

function show(data) {
  rows = findRecords(data).flatMap(expand).map(r => flatten(r));
  columns = [...new Set(rows.flatMap(Object.keys))];
  $("fields").innerHTML = columns.map(c =>
    `<label><input type="checkbox" value="${c}" checked>${c}</label>`).join("");
  $("count").textContent = `${rows.length} rows · ${columns.length} fields`;
  $("raw").textContent = JSON.stringify(data, null, 2);
  $("results").classList.remove("hidden");
  renderTable();
}

// ---- Tabs: each keeps its own last response, shown in the shared Fields / table section ----
let activeTab = "macro";
const lastData = {};

function display(tab, data) {
  lastData[tab] = data;
  if (tab === activeTab) show(data);
}

function showTab(name) {
  activeTab = name;
  document.querySelectorAll("#tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === name);
    $(`tab-${b.dataset.tab}`).classList.toggle("hidden", b.dataset.tab !== name);
  });
  if (lastData[name]) show(lastData[name]); else $("results").classList.add("hidden");
}

$("tabs").onclick = e => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); };

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
}

function selectedData() {
  const cols = selected();
  return rows.map(r => Object.fromEntries(cols.map(c => [c, r[c]])));
}

$("csvBtn").onclick = () => {
  const cols = selected();
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.map(cell).join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\n");
  download("export.csv", "﻿" + csv, "text/csv");  // BOM so Excel shows Arabic correctly
};
$("jsonBtn").onclick = () => download("export.json", JSON.stringify(selectedData(), null, 2), "application/json");
$("fields").onchange = renderTable;
$("allBtn").onclick = () => { document.querySelectorAll("#fields input").forEach(c => c.checked = true); renderTable(); };
$("noneBtn").onclick = () => { document.querySelectorAll("#fields input").forEach(c => c.checked = false); renderTable(); };
// ---- Group / Field pickers: choose by name instead of typing IDs ----
let groupNames = {};   // groupID -> "Parent › Name"
let fieldNames = {};   // fieldID -> name
const escAttr = s => String(s ?? "").trim().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function getJSON(url) {
  const res = await fetch(url);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// On GitHub Pages there is no Flask server: savedFiles lists the JSON files published with the page,
// as paths relative to data/ (e.g. macroeconomic/indicator_groups.json).
// It stays null when running locally through app.py.
let savedFiles = null;
let allGroups = [];

// File names come from static/endpoints.json: each endpoint's "file" template says where its responses
// are saved under data/<api>/. Python uses the same templates (saved_file in argaam_client.py), so the
// page never builds a file name by hand. Example: analyst_estimates -> fundamentals/analyst_estimates/3_2222_year.json
let allEndpoints = {};  // id -> endpoint, for every API; `endpoints` holds the macroeconomic ones for the dropdown
const fill = (template, values) => template.replace(/\{(\w+)\}/g, (_, k) => values[k]);
const savedPath = (id, values = {}) => `${allEndpoints[id].api}/${fill(allEndpoints[id].file, values)}.json`;
const savedFolder = id => { const ep = allEndpoints[id]; return `${ep.api}/${ep.file.slice(0, ep.file.lastIndexOf("/") + 1)}`; };

// Which macroeconomic endpoint a typed path belongs to, and its values (same as match_path in argaam_client.py).
function matchPath(path) {
  for (const ep of endpoints) {
    const parts = ep.path.split(/\{(\w+)\}/);  // literal, name, literal, name, ...
    const re = new RegExp("^" + parts.map((p, i) => i % 2 ? "([A-Za-z0-9-]+)" : p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + "$");
    const m = path.trim().replace(/\/+$/, "").match(re);
    if (m) return { id: ep.id, values: Object.fromEntries(parts.filter((_, i) => i % 2).map((name, j) => [name, m[j + 1]])) };
  }
  return null;
}

// With saved data, offer only the groups that have something saved for the chosen endpoint.
function groupHasData(groupId) {
  if (!savedFiles) return true;
  if (!endpoints[$("endpoint").value].path.includes("{fieldId}")) return savedFiles.has(savedPath("indicator_fields", { groupId }));
  const prefix = savedPath("indicator_values", { groupId, fieldId: "" }).slice(0, -".json".length);  // e.g. macroeconomic/indicator_values/33_
  return [...savedFiles].some(f => f.startsWith(prefix));
}

function renderGroups() {
  const previous = $("group").value;
  $("group").innerHTML = `<option value="">Choose a group…</option>` + allGroups.map(g => {
    const subs = g.subGroups || [];
    groupNames[g.groupID] = g.nameEn.trim();
    if (!subs.length) return groupHasData(g.groupID) ? `<option value="${g.groupID}">${escAttr(g.nameEn)} (${g.groupID})</option>` : "";
    subs.forEach(sg => groupNames[sg.groupID] = `${g.nameEn.trim()} › ${sg.nameEn.trim()}`);
    const shown = subs.filter(sg => groupHasData(sg.groupID));
    if (!shown.length) return "";
    return `<optgroup label="${escAttr(g.nameEn)} (${g.groupID})">` + shown.map(sg =>
      `<option value="${sg.groupID}">${escAttr(sg.nameEn)} (${sg.groupID})</option>`).join("") + `</optgroup>`;
  }).join("");
  $("group").value = previous;
  if ($("group").value !== previous || !previous) { $("group").value = ""; loadFields(""); }
}

async function loadGroups() {
  try {
    allGroups = await getJSON(savedFiles ? `data/${savedPath("indicator_groups")}` : "/api/groups");
    renderGroups();
  } catch (e) {
    $("group").innerHTML = `<option value="">Could not load groups: ${escAttr(e.message)}</option>`;
  }
}

async function loadFields(groupId) {
  fieldNames = {};
  const sel = $("field");
  sel.disabled = true;
  if (!groupId) { sel.innerHTML = `<option value="">Choose a group first</option>`; return; }
  sel.innerHTML = `<option value="">Loading fields…</option>`;
  try {
    const fields = await getJSON(savedFiles ? `data/${savedPath("indicator_fields", { groupId })}` : `/api/groups/${groupId}/fields`);
    fields.forEach(f => fieldNames[f.fieldID] = (f.displayNameEn || "").trim());
    const shown = savedFiles ? fields.filter(f => savedFiles.has(savedPath("indicator_values", { groupId, fieldId: f.fieldID }))) : fields;
    sel.innerHTML = `<option value="">Choose a field…</option>` + shown.map(f =>
      `<option value="${f.fieldID}">${escAttr(f.displayNameEn)} (${f.fieldID})</option>`).join("");
    sel.disabled = false;
  } catch (e) {
    sel.innerHTML = `<option value="">No fields: ${escAttr(e.message)}</option>`;
  }
}

// Build the path from the endpoint template and the picked IDs; unpicked ones stay as {placeholders}.
function buildPath() {
  const ep = endpoints[$("endpoint").value];
  let path = ep.path;
  if ($("group").value) path = path.replace("{groupId}", $("group").value);
  if ($("field").value) path = path.replace("{fieldId}", $("field").value);
  $("path").value = path;
  updateHint();
}

// Say in words what the IDs in the current path mean, e.g. "33 = National Accounts".
function updateHint() {
  const m = $("path").value.match(/groups\/(\d+)(?:\/fields\/(\d+))?/);
  const parts = [];
  if (m && m[1]) parts.push(`Group <b>${m[1]}</b> = ${escAttr(groupNames[m[1]] || "unknown group")}`);
  if (m && m[2]) parts.push(`Field <b>${m[2]}</b> = ${escAttr(fieldNames[m[2]] || "not in this group's field list")}`);
  $("hint").innerHTML = parts.join(" &nbsp;·&nbsp; ");
}

function onEndpointChange() {
  const ep = endpoints[$("endpoint").value];
  const needsGroup = ep.path.includes("{groupId}");
  $("pickers").classList.toggle("hidden", !needsGroup);
  $("fieldWrap").classList.toggle("hidden", !ep.path.includes("{fieldId}"));
  if (savedFiles) renderGroups();
  if (needsGroup) buildPath(); else { $("path").value = ep.path; updateHint(); }
}

$("endpoint").onchange = onEndpointChange;
$("group").onchange = async () => { buildPath(); await loadFields($("group").value); buildPath(); };
$("field").onchange = buildPath;
$("path").oninput = updateHint;

async function fetchMacro(refresh) {
  $("status").className = "status";
  $("status").textContent = "Fetching…";
  try {
    if (savedFiles) {
      const match = matchPath($("path").value);
      const file = match && savedPath(match.id, match.values);
      if (!file || !savedFiles.has(file)) throw new Error("No saved data for this path. Choose a group and field from the dropdowns.");
      const data = await getJSON(`data/${file}`);
      $("status").textContent = "Done · showing saved data";
      display("macro", data);
      return;
    }
    const res = await fetch("/api/fetch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base: $("base").value, path: $("path").value, refresh }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    $("status").textContent = body.from_cache ? `Done · loaded saved copy, data/${body.saved_to}` : `Done · saved to data/${body.saved_to}`;
    display("macro", body.data);
  } catch (e) {
    $("status").className = "status error";
    $("status").textContent = e.message;
  }
}

$("fetchBtn").onclick = () => fetchMacro(false);
$("refreshBtn").onclick = () => fetchMacro(true);

// ---- Fundamentals: analyst estimates ----

function clearEstimates() {
  delete lastData.fundamentals;
  if (activeTab === "fundamentals") $("results").classList.add("hidden");
}

async function fetchEstimates(refresh) {
  const symbol = $("symbol").value.trim();
  const marketId = $("market").value;
  const period = $("period").value;
  $("fStatus").className = "status";
  $("fStatus").textContent = "Fetching…";
  try {
    let body;
    if (savedFiles) {
      const file = savedPath("analyst_estimates", { marketId, symbol, period });
      if (!savedFiles.has(file)) throw new Error("No saved data for this company and period.");
      body = { data: await getJSON(`data/${file}`), saved_to: file, from_cache: true };
    } else {
      const query = new URLSearchParams({ symbol, marketId, period, ...(refresh ? { refresh: "1" } : {}) });
      body = await getJSON(`/api/fundamentals/analyst-estimates?${query}`);
    }
    if (!body.data.data.estimates.length) throw new Error("The API returned no estimates for this company and period.");
    display("fundamentals", body.data);
    $("fStatus").textContent = body.from_cache ? `Done · loaded saved copy, data/${body.saved_to}` : `Done · saved to data/${body.saved_to}`;
  } catch (e) {
    clearEstimates();
    $("fStatus").className = "status error";
    $("fStatus").textContent = e.message;
  }
}

// On the published page, data comes only from saved files, so there is nothing to re-fetch.
function showSavedEstimates() {
  const hasSaved = [...savedFiles].some(f => f.startsWith(savedFolder("analyst_estimates")));
  $("fRefreshBtn").remove();
  $("fHint").textContent = hasSaved
    ? "Enter a stock symbol to load its saved estimates. Companies without saved estimates show a no-data message."
    : "No analyst estimates have been saved yet.";
}

$("fFetchBtn").onclick = () => fetchEstimates(false);
$("fRefreshBtn").onclick = () => fetchEstimates(true);
$("symbol").onkeydown = e => { if (e.key === "Enter") fetchEstimates(false); };

async function init() {
  const saved = await fetch("saved_files.json").catch(() => null);
  if (saved && saved.ok) {
    savedFiles = new Set(await saved.json());
    $("savedNote").classList.remove("hidden");
    $("refreshBtn").remove();
    $("base").parentElement.remove();  // the API base only matters for live requests
    $("endpoint").parentElement.style.gridColumn = "1 / -1";
    endpoints = await getJSON("endpoints.json");
  } else {
    const cfg = await getJSON("/api/config");
    endpoints = cfg.endpoints;
    $("base").value = cfg.base;
  }
  allEndpoints = Object.fromEntries(endpoints.map(e => [e.id, e]));
  endpoints = endpoints.filter(e => e.api === "macroeconomic");  // the Macroeconomic tab's dropdown
  $("endpoint").innerHTML = endpoints.map((e, i) => `<option value="${i}">${e.name}</option>`).join("");
  onEndpointChange();
  loadFields("");
  loadGroups().then(updateHint);
  if (savedFiles) showSavedEstimates();
}
init();
</script>
</body>
</html>
