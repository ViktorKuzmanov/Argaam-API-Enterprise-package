# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site from the page and saved data
        run: |
          mkdir _site
          cp -r static/. _site/
          cp -r data _site/data
          # Paths relative to data/, e.g. macroeconomic/indicator_groups.json. Files starting with _ (like _progress.json) are bookkeeping, not data.
          python3 -c "import json, pathlib; print(json.dumps(sorted(p.relative_to('data').as_posix() for p in pathlib.Path('data').rglob('*.json') if not p.name.startswith('_'))))" > _site/saved_files.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the built site, so index.html is served at the site root
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
